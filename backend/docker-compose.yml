version: '3.8'

services:
  db:
    image: postgres:15
    container_name: taskflow_postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: taskflow_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://user:pass@db:5432/taskflow"
      JWT_SECRET: "secreto-super-seguro-que-deve-ser-mudado-em-producao"
      JWT_REFRESH_SECRET: "outro-secreto-para-refresh-tokens-que-tambem-deve-ser-mudado"
      CLIENT_URL: "http://localhost:3000"
      NODE_ENV: "development"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data: