<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Login & Registro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="icons/favicon.ico">
    <style>
        /* Estilos específicos para a tela de login */
        .auth-container {
            display: flex;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), #667eea);
        }
        
        .auth-illustration {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 2rem;
            text-align: center;
        }
        
        .auth-illustration-content {
            max-width: 500px;
        }
        
        .auth-illustration i {
            font-size: 8rem;
            margin-bottom: 1.5rem;
            opacity: 0.9;
        }
        
        .auth-illustration h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        
        .auth-illustration p {
            font-size: 1.1rem;
            opacity: 0.9;
            line-height: 1.6;
        }
        
        .auth-form-container {
            width: 450px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--bg-primary);
        }
        
        .auth-form {
            width: 100%;
            max-width: 350px;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-header h1 {
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }
        
        .auth-header p {
            color: var(--text-secondary);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius-md);
            font-size: 1rem;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: all var(--transition-fast);
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(26, 54, 93, 0.2);
        }
        
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: var(--border-radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            margin-bottom: 1rem;
        }
        
        .auth-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        
        .auth-switch {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-secondary);
        }
        
        .auth-switch a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .auth-switch a:hover {
            text-decoration: underline;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--text-secondary);
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }
        
        .divider span {
            padding: 0 1rem;
            font-size: 0.9rem;
        }
        
        .auth-error {
            color: var(--danger-color);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }
        
        .password-toggle {
            position: relative;
        }
        
        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
        }
        
        @media (max-width: 992px) {
            .auth-container {
                flex-direction: column;
            }
            
            .auth-illustration {
                padding: 2rem 1rem;
            }
            
            .auth-illustration h2 {
                font-size: 2rem;
            }
            
            .auth-form-container {
                width: 100%;
                min-height: 500px;
            }
        }
        
        @media (max-width: 480px) {
            .auth-form-container {
                padding: 1.5rem;
            }
            
            .auth-form {
                max-width: 100%;
                padding: 0 1rem;
            }
        }
    </style>
    <script src="js/auth.js"></script>
</head>
<body class="light-theme">
    <div class="auth-container">
        <div class="auth-illustration">
            <div class="auth-illustration-content">
                <i class="fas fa-tasks"></i>
                <h2>Organize sua vida com TaskFlow</h2>
                <p>Gerencie suas tarefas de forma eficiente, aumente sua produtividade e alcance seus objetivos com nossa plataforma completa de gerenciamento de tarefas.</p>
            </div>
        </div>
        
        <div class="auth-form-container">
            <div class="auth-form">
                <div class="auth-header">
                    <h1>Bem-vindo de volta</h1>
                    <p>Faça login na sua conta para continuar</p>
                </div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="seu@email.com" required>
                    </div>
                    
                    <div class="form-group password-toggle">
                        <label for="loginPassword">Senha</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" id="toggleLoginPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    
                    <div class="form-group" style="text-align: right;">
                        <a href="#" id="forgotPasswordLink" style="color: var(--primary-color); text-decoration: none; font-size: 0.9rem;">
                            Esqueceu sua senha?
                        </a>
                    </div>
                    
                    <button type="submit" class="auth-btn">Entrar</button>
                    
                    <div id="loginError" class="auth-error"></div>
                </form>
                
                <div class="divider">
                    <span>ou</span>
                </div>
                
                <form id="registerForm" style="display: none;">
                    <div class="form-group">
                        <label for="registerName">Nome completo</label>
                        <input type="text" id="registerName" placeholder="Seu nome" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="registerEmail">Email</label>
                        <input type="email" id="registerEmail" placeholder="seu@email.com" required>
                    </div>
                    
                    <div class="form-group password-toggle">
                        <label for="registerPassword">Senha</label>
                        <input type="password" id="registerPassword" placeholder="••••••••" required minlength="6">
                        <button type="button" class="password-toggle-btn" id="toggleRegisterPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    
                    <div class="form-group password-toggle">
                        <label for="registerConfirmPassword">Confirmar senha</label>
                        <input type="password" id="registerConfirmPassword" placeholder="••••••••" required>
                        <button type="button" class="password-toggle-btn" id="toggleRegisterConfirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    
                    <button type="submit" class="auth-btn">Criar conta</button>
                    
                    <div id="registerError" class="auth-error"></div>
                </form>
                
                <div class="auth-switch">
                    <p id="authToggleText">Não tem uma conta? <a href="#" id="toggleAuth">Registre-se</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Atualizar o evento de alternância entre login e registro
        document.addEventListener('DOMContentLoaded', function() {
            // O script auth.js já inicializa as funcionalidades
            // Aqui apenas adicionamos manipuladores específicos para esta página
            const forgotPasswordLink = document.getElementById('forgotPasswordLink');
            if (forgotPasswordLink) {
                forgotPasswordLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.location.href = 'recovery.html';
                });
            }

            // Configurar alternância entre login e registro (não é feita pelo script principal)
            const toggleAuthLink = document.getElementById('toggleAuth');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const authToggleText = document.getElementById('authToggleText');

            if (toggleAuthLink) {
                toggleAuthLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    const isLoginVisible = loginForm.style.display !== 'none';

                    if (isLoginVisible) {
                        // Mostrar registro, esconder login
                        loginForm.style.display = 'none';
                        registerForm.style.display = 'block';
                        authToggleText.innerHTML = 'Já tem uma conta? <a href="#" id="toggleAuth">Faça login</a>';
                    } else {
                        // Mostrar login, esconder registro
                        loginForm.style.display = 'block';
                        registerForm.style.display = 'none';
                        authToggleText.innerHTML = 'Não tem uma conta? <a href="#" id="toggleAuth">Registre-se</a>';
                    }

                    // Reanexar o evento ao novo link
                    document.getElementById('toggleAuth').addEventListener('click', arguments.callee);
                });
            }
        });
    </script>
</body>
</html>
